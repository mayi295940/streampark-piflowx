spark.master=yarn
spark.deploy.mode=cluster

#hdfs default file system
fs.defaultFS=hdfs://192.168.186.100:8082
#yarn resourcemanager hostname
yarn.resourcemanager.hostname=192.168.186.100:8088

#if you want to use hive, set hive metastore uris
hive.metastore.uris=thrift://192.168.186.100:9083

#show data in log, set 0 if you do not show the logs
data.show=10

#monitor the throughput of flow
monitor.throughput=true

server.port=8001

#server db, support h2, mysql
#server.db.type=h2
#db port
#server.db.port=50001
#
#server.db.driver=org.h2.Driver

server.db.type=mysql
#server port
server.db.port=3306
#server port
server.db.driver=com.mysql.cj.jdbc.Driver
server.db.url=jdbc:mysql://127.0.0.1:3306/taier?characterEncoding=utf8&autoReconnect=true&tinyInt1isBit=false&serverTimezone=Asia/Shanghai
server.db.username=root
server.db.password=123456


flink.jobmanager.rpc.address=192.168.186.100
flink.jobmanager.rpc.port=6123
flink.rest.port=8081
